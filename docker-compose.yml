services:
  db:
    image: postgres:16-alpine
    container_name: beepay-db
    environment:
      POSTGRES_DB: beepay
      POSTGRES_USER: beepay
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beepay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
